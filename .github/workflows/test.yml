name: test

on: workflow_dispatch

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          forge build
        id: build

      - name: Check marketplace release sizes
        run: |
          FOUNDRY_PROFILE=universal_marketplace forge build src/UniversalPoolArtMarketplace.sol src/FameMarketplaceCheckout.sol --force
          npm run marketplace:size
        id: marketplace-size

      - name: Run marketplace release tooling tests
        run: |
          npm run marketplace:evidence:test
          npm run marketplace:deployment:test
        id: marketplace-tooling-tests

      - name: Run marketplace release-profile Forge tests
        env:
          FOUNDRY_PROFILE: universal_marketplace
        run: |
          forge test --match-path test/UniversalPoolArtMarketplace.t.sol -vvv
          forge test --match-path test/UniversalPoolArtMarketplaceProviderInventory.t.sol -vvv
          forge test --match-path test/UniversalPoolArtMarketplaceFuzz.t.sol -vvv
          forge test --match-path test/UniversalPoolArtMarketplaceInvariant.t.sol -vvv
          forge test --match-path test/UniversalPoolArtMarketplaceDeploymentValidationBase.t.sol -vvv
          forge test --match-path test/FameMarketplaceCheckout.t.sol -vvv
          forge test --match-path test/FameMarketplaceCheckoutRedemption.t.sol -vvv
          forge test --match-path test/FameMarketplaceCheckoutFuzz.t.sol -vvv
          forge test --match-path test/FameMarketplaceCheckoutInvariant.t.sol -vvv
        id: marketplace-release-tests

      - name: Run full repository Forge regression
        env:
          FOUNDRY_PROFILE: ci
        run: |
          forge test -vvv
        id: test
