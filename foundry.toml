[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
fs_permissions = [
  { access = "read", path = "./test/router/fixtures" },
  { access = "read", path = "./script/manifests" },
  { access = "read", path = "./config/fame-public.env" },
]
remappings = [
  "forge-std=lib/forge-std/src",
  "solady=lib/solady/src",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin5/contracts/=lib/openzeppelin-contracts-5/contracts/",
  "@uniswap/v3-core/contracts/=lib/v3-core/contracts/",
  "@uniswap/v2-core/contracts/=lib/v2-core/contracts/",
  "@uniswap/v3-periphery/contracts/=lib/v3-periphery/contracts/",
  "@uniswap/swap-router-contracts/contracts/=lib/swap-router-contracts/contracts/",
  "@AbdelStark/token-vesting-contracts/=lib/token-vesting-contracts/src/"
]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.universal_marketplace]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.universal_marketplace.fuzz]
runs = 10000
max_test_rejects = 65536

[profile.universal_marketplace.invariant]
runs = 512
depth = 128
fail_on_revert = true
show_metrics = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"
base = "${BASE_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${BASE_ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${BASE_ETHERSCAN_API_KEY}" }
